name: Build Release

on:
  push:
    tags:
      - '*-doxx*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-dev libmnl-dev libbsd-dev autoconf automake libtool byacc

      - name: Build
        run: |
          ./autogen.sh
          ./configure --prefix=/ --sysconfdir=/etc --localstatedir=/var \
            --with-privsep-user=_bgpd \
            CFLAGS="-O2 -fstack-protector-all -D_FORTIFY_SOURCE=2"
          make -j$(nproc)

      - name: Verify libmnl linkage
        run: ldd src/bgpd/bgpd | grep libmnl

      - name: Prepare binaries
        run: |
          cp src/bgpd/bgpd bgpd-linux-amd64
          cp src/bgpctl/bgpctl bgpctl-linux-amd64
          chmod 755 bgpd-linux-amd64 bgpctl-linux-amd64
          sha256sum bgpd-linux-amd64 bgpctl-linux-amd64 > checksums.txt

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            bgpd-linux-amd64
            bgpctl-linux-amd64
            checksums.txt
