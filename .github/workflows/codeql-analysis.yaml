name: CodeQL analysis

on:
  schedule:
    - cron: '22 5 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (cpp)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: cpp
    - name: Build
      run: |
        sudo apt-get update
        sudo apt-get install -y libevent-dev libmnl-dev libbsd-dev autoconf automake libtool byacc
        ./autogen.sh
        ./configure --prefix=/ --sysconfdir=/etc --localstatedir=/var --with-privsep-user=_bgpd
        make -j$(nproc)
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:cpp"
